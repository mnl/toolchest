name: Build container

on:
  push:
    tags: [ 'v*.*.*' ]
    branches:
      - main
  schedule:
    - cron: "20 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # for cosign

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/toolchest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=toolchest
            org.opencontainers.image.description=A toolchest of useful programs
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision={{sha}}
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          annotations: |
            org.opencontainers.image.title=toolchest
            org.opencontainers.image.description=A toolchest of useful programs
            org.opencontainers.image.authors=${{ github.actor }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  update-floating-tags:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update floating tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Ignoring non-SemVer tag: $VERSION"
              exit 0
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          if (( major == 0 )); then
              echo "Ignoring unstable version: $VERSION"
              exit 0
          fi

          major_tag="v${major}"
          minor_tag="v${major}.${minor}"

          latest_major="$(
              git tag --list "v${major}.*.*" |
                  sort -V |
                  tail -n1
          )"

          latest_minor="$(
              git tag --list "v${major}.${minor}.*" |
                  sort -V |
                  tail -n1
          )"

          git tag --force "$major_tag" "$latest_major"
          git tag --force "$minor_tag" "$latest_minor"

          git push --force origin \
              "refs/tags/${major_tag}" \
              "refs/tags/${minor_tag}"

